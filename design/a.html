<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>A 液面</title>
<style>
  :root { --c: #f59e0b; --d: #b45309; --ease: cubic-bezier(.05,.7,.1,1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: var(--d); color: #fff; font-family: -apple-system, "PingFang TC", sans-serif; transition: background .6s var(--ease); }
  /* 液面：顏色較亮的那一層，隨時間由滿往下降 */
  #liquid { position: fixed; inset: 0; transform: translateY(var(--y, 0%)); background: var(--c); transition: background .6s var(--ease); }
  #wave { position: absolute; left: 0; top: -23px; width: 200%; height: 24px; fill: var(--c); transition: fill .6s var(--ease); animation: drift 3s linear infinite; }
  @keyframes drift { to { transform: translateX(-50%); } }
  #ui { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); text-align: center; }
  #meta { font-size: 18px; font-weight: 600; opacity: .85; display: flex; justify-content: space-between; }
  #center { display: grid; place-content: center; }
  #label { font-size: clamp(32px, 10vw, 56px); font-weight: 800; letter-spacing: .1em; }
  #num { font-size: min(62vw, 46vh); font-weight: 900; line-height: .95; font-variant-numeric: tabular-nums; letter-spacing: -.04em; }
  #next { font-size: 18px; font-weight: 600; opacity: .85; }
  .enter #label { animation: rise .5s var(--ease) both; }
  .enter #num { animation: rise .5s .06s var(--ease) both; }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
  .beat #num { animation: beat .35s cubic-bezier(.2,0,0,1); }
  @keyframes beat { 30% { transform: scale(1.12); } }
  #pause, #start, #done { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center; background: rgba(0,0,0,.55); font-size: 28px; font-weight: 800; }
  #pause { opacity: 0; pointer-events: none; transition: opacity .25s; }
  .paused #pause { opacity: 1; }
  #start { border: 0; color: #fff; background: #111; font: inherit; font-size: 28px; font-weight: 800; }
  #done { display: none; background: #16a34a; }
  .finished #done { display: grid; animation: rise .6s var(--ease) both; }
  #done button { font: inherit; font-size: 20px; padding: 14px 28px; border-radius: 99px; border: 2px solid #fff; background: none; color: #fff; }
  a.back { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); color: #fff; opacity: .5; font-size: 13px; text-decoration: none; z-index: 5; }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<div id="liquid"><svg id="wave" viewBox="0 0 200 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0 12 Q25 0 50 12 T100 12 T150 12 T200 12 V24 H0Z"/></svg></div>
<div id="ui" aria-live="polite">
  <div id="meta"><span id="m1"></span><span>A 液面</span></div>
  <div id="center"><div id="label"></div><div id="num"></div></div>
  <div id="next"></div>
</div>
<div id="pause">已暫停<div style="font-size:18px;font-weight:600">點一下繼續</div></div>
<div id="done"><div style="font-size:44px">訓練完成</div><div style="font-size:18px;font-weight:600">2 組 × 2 回</div><button id="again">再看一次</button></div>
<button id="start">點一下開始預覽</button>
<a class="back" href="./">‹ 回樣品列表</a>
<script src="engine.js"></script>
<script>
const COLORS = { prep: ['#f59e0b', '#92400e'], work: ['#ef4444', '#7f1d1d'], rest: ['#14b8a6', '#134e4a'], setRest: ['#6366f1', '#312e81'] };
const $ = id => document.getElementById(id), root = document.documentElement, b = document.body;
const begin = runDemo({
  onPhase(p) {
    const [c, d] = COLORS[p.type];
    root.style.setProperty('--c', c); root.style.setProperty('--d', d);
    $('label').textContent = p.label; $('m1').textContent = p.meta; $('next').textContent = p.next;
    b.classList.remove('enter', 'beat'); void b.offsetWidth; b.classList.add('enter');
  },
  onFrame({ progress }) { $('liquid').style.setProperty('--y', (progress * 100).toFixed(2) + '%'); },
  onSecond(sec) {
    $('num').textContent = sec;
    if (sec <= 3) { b.classList.remove('beat'); void b.offsetWidth; b.classList.add('beat'); }
  },
  onPause(on) { b.classList.toggle('paused', on); },
  onDone() { b.classList.add('finished'); },
});
wireStart(begin);
</script>
</body>
</html>
