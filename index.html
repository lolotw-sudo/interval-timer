<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="間歇計時">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>間歇計時</title>
<style>
  @property --c { syntax: '<color>'; inherits: true; initial-value: #fb7185; }
  :root { --c: #fb7185; --ease: cubic-bezier(.4,0,.2,1); --line: #27272a; --sub: #a1a1aa; --card: #16161c; transition: --c .6s var(--ease); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { touch-action: manipulation; background: #0b0b0f; color: #f5f5f5; font-family: -apple-system, "PingFang TC", sans-serif; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  /* 背景光暈：階段色，慢慢呼吸 */
  #aura { position: fixed; inset: -25%; background: radial-gradient(circle at 50% 45%, var(--c), transparent 62%); opacity: .45; pointer-events: none; animation: breathe 4s ease-in-out infinite alternate; }
  body[data-screen="setup"] #aura { opacity: .16; background: radial-gradient(circle at 50% 0%, var(--c), transparent 55%); animation-duration: 5s; }
  @keyframes breathe { to { opacity: .55; transform: scale(1.05); } }
  body[data-screen="setup"] #aura { animation-name: breathe-soft; }
  @keyframes breathe-soft { to { opacity: .24; transform: scale(1.05); } }

  /* 三個畫面切換 */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); opacity: 0; visibility: hidden; transform: scale(.98); transition: opacity .4s var(--ease), transform .4s var(--ease), visibility .4s; }
  body[data-screen="setup"] #setup, body[data-screen="run"] #run, body[data-screen="done"] #done { opacity: 1; visibility: visible; transform: none; }

  /* ── 設定頁 ── */
  header { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
  .chip { display: flex; align-items: center; gap: 6px; font-size: 17px; padding: 10px 16px; border-radius: 99px; border: 1px solid var(--line); min-height: 44px; max-width: 70vw; transition: transform .12s var(--ease), background .2s; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip:active { transform: scale(.96); background: #1c1c22; }
  .icon { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 20px; }
  .icon[aria-pressed="false"] { color: #71717a; }
  #total { text-align: center; margin: 14px 0 10px; }
  #total small { display: block; font-size: 14px; color: var(--sub); letter-spacing: .2em; }
  #total b { font-size: 56px; font-weight: 200; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  #go { margin: 4px 0 16px; min-height: 64px; border-radius: 99px; background: #fb7185; color: #1a0508; font-size: 22px; font-weight: 600; letter-spacing: .3em; transition: transform .15s var(--ease); }
  #go:active { transform: scale(.97); }
  ul#rows { list-style: none; padding: 0; display: grid; align-content: start; gap: 2px; overflow-y: auto; }
  .row { display: grid; grid-template-columns: 1fr 52px 96px 52px; align-items: center; gap: 4px; padding: 10px 4px; border-bottom: 1px solid var(--line); transition: opacity .3s var(--ease); }
  .row.off { opacity: .3; }
  .row .name { font-size: 18px; display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .val { text-align: center; font-size: 28px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .val small { font-size: .5em; }
  .val.bump { animation: bump .25s var(--ease); }
  @keyframes bump { 40% { transform: scale(1.12); } }
  .step { width: 52px; height: 52px; border-radius: 50%; background: var(--card); font-size: 26px; font-weight: 300; transition: transform .12s var(--ease), background .2s; touch-action: manipulation; }
  .step:active { transform: scale(.9); background: #26262e; }
  .step:disabled { opacity: .25; }

  /* 常用設定抽屜 */
  dialog { margin: auto 0 0; width: 100%; max-width: 100%; max-height: 80vh; border: 0; padding: 8px 16px max(20px, env(safe-area-inset-bottom)); border-radius: 24px 24px 0 0; background: #16161c; color: inherit; transform: translateY(100%); transition: transform .4s var(--ease); }
  dialog.show { transform: none; }
  dialog::backdrop { background: rgba(0,0,0,.6); opacity: 0; transition: opacity .4s var(--ease); }
  dialog.show::backdrop { opacity: 1; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: #3f3f46; margin: 0 auto 14px; }
  dialog h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  #plist { list-style: none; padding: 0; }
  #plist li { display: flex; align-items: center; border-bottom: 1px solid var(--line); animation: slidein .35s var(--ease) both; }
  #plist li:nth-child(2) { animation-delay: .04s; } #plist li:nth-child(3) { animation-delay: .08s; } #plist li:nth-child(n+4) { animation-delay: .12s; }
  @keyframes slidein { from { opacity: 0; transform: translateY(12px); } }
  #plist .pick { flex: 1; text-align: left; padding: 14px 4px; min-height: 56px; }
  #plist .pick b { font-weight: 500; font-size: 18px; }
  #plist .pick span { display: block; color: var(--sub); font-size: 14px; margin-top: 2px; }
  #plist .del { width: 44px; height: 44px; color: #a1a1aa; font-size: 20px; }
  #plist li.gone { animation: out .25s var(--ease) forwards; }
  @keyframes out { to { opacity: 0; transform: translateX(40px); } }
  #saveForm { display: flex; gap: 8px; margin-top: 16px; }
  #saveForm input { flex: 1; min-width: 0; font: inherit; font-size: 17px; color: inherit; background: #0b0b0f; border: 1px solid var(--line); border-radius: 12px; padding: 12px; -webkit-user-select: text; user-select: text; }
  #saveForm button { padding: 0 18px; border-radius: 12px; background: #fb7185; color: #1a0508; font-weight: 600; }
  #toast { position: fixed; inset: max(60px, env(safe-area-inset-top)) auto auto 50%; margin: 0; border: 0; color: inherit; transform: translate(-50%, -20px); opacity: 0; background: #3f3f46; padding: 10px 18px; border-radius: 99px; font-size: 15px; transition: .3s var(--ease); pointer-events: none; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ── 計時頁 ── */
  #run { touch-action: none; text-align: center; }
  .meta { font-size: 18px; color: var(--sub); display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  #wakeWarn { font-size: 14px; color: #fbbf24; margin-top: 4px; }
  #stage { flex: 1; position: relative; display: grid; place-items: center; }
  svg#ring { width: min(94vw, 62vh); height: min(94vw, 62vh); transform: rotate(-90deg); overflow: visible; }
  #track { stroke: var(--line); }
  #arc { stroke: var(--c); stroke-linecap: round; transition: stroke-width .3s var(--ease); }
  .final #arc { stroke-width: 7; }
  #hold { stroke: #fff; stroke-dashoffset: 100; opacity: 0; }
  .holding #hold { opacity: 1; stroke-dashoffset: 0; transition: stroke-dashoffset .7s linear; }
  #inner { position: absolute; display: grid; place-items: center; }
  #label { font-size: clamp(28px, 9vw, 40px); font-weight: 600; letter-spacing: .12em; color: var(--c); }
  #digits { position: relative; height: 1em; width: 3ch; font-size: min(56vw, 36vh); overflow: hidden; }
  #digits.long { font-size: calc(min(56vw, 36vh) * .6); width: 5ch; }
  #digits span { position: absolute; inset: 0; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.03em; transition: transform .45s var(--ease), opacity .45s var(--ease); }
  #digits span.out { transform: translateY(-60%); opacity: 0; }
  #digits span.in { transform: translateY(60%); opacity: 0; transition: none; }
  #next { font-size: 18px; color: var(--sub); }
  .enter #label { animation: slide .5s var(--ease) both; }
  @keyframes slide { from { transform: translateY(16px); opacity: 0; letter-spacing: .5em; } }
  #pause { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; background: rgba(11,11,15,.82); font-size: 30px; font-weight: 300; letter-spacing: .1em; opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); }
  #pause small { font-size: 17px; color: var(--sub); letter-spacing: .05em; }
  .paused #pause { opacity: 1; }

  /* ── 完成畫面 ── */
  #done { justify-content: center; align-items: center; gap: 14px; text-align: center; }
  #done h1 { font-size: 44px; font-weight: 300; letter-spacing: .1em; }
  #done p { color: var(--sub); font-size: 18px; }
  body[data-screen="done"] #done h1 { animation: slide .6s var(--ease) both; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, ::backdrop { animation: none !important; }
    #digits span, .screen, dialog, .val { transition-duration: .01s !important; }
  }
</style>
</head>
<body data-screen="setup">
<div id="aura"></div>
<div id="sr" class="sr" aria-live="assertive"></div>

<section class="screen" id="setup" aria-label="設定">
  <header>
    <button class="chip" id="openPresets" aria-haspopup="dialog" aria-label="常用設定">☰ <span id="pname"></span></button>
    <button class="icon" id="sound" aria-label="聲音"></button>
  </header>
  <div id="total" aria-live="polite"><small>總時間</small><b id="tt"></b></div>
  <button id="go">開始</button>
  <ul id="rows"></ul>
</section>

<section class="screen" id="run" aria-label="計時中，點一下暫停，長按一秒結束">
  <div class="meta"><span id="pos"></span><span id="left" aria-label="總剩餘"></span></div>
  <div id="wakeWarn" hidden>⚠ 螢幕可能會自動變暗</div>
  <div id="stage">
    <svg id="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle id="track" cx="50" cy="50" r="45" fill="none" stroke-width="4"/>
      <circle id="arc" cx="50" cy="50" r="45" fill="none" stroke-width="4" pathLength="100" stroke-dasharray="100"/>
      <circle id="hold" cx="50" cy="50" r="49.5" fill="none" stroke-width="1.5" pathLength="100" stroke-dasharray="100"/>
    </svg>
    <div id="inner"><div id="label"></div><div id="digits" aria-hidden="true"></div></div>
  </div>
  <div id="next"></div>
  <div id="pause">已暫停<small>點一下繼續<br>長按 1 秒結束</small><small>螢幕常亮：<span id="wakeState">—</span></small></div>
</section>

<section class="screen" id="done" aria-label="訓練完成">
  <h1>訓練完成</h1>
  <p id="doneInfo"></p>
  <p>點一下回到設定</p>
</section>

<dialog id="sheet" aria-label="常用設定">
  <div class="grab"></div>
  <h2>常用設定</h2>
  <ul id="plist"></ul>
  <form id="saveForm">
    <input id="newName" maxlength="12" placeholder="把目前設定存成…" aria-label="新設定名稱" required>
    <button>儲存</button>
  </form>
</dialog>
<div id="toast" role="status" popover="manual"></div>

<script src="app.js"></script>
</body>
</html>
