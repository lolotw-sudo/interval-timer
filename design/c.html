<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>C 彈跳</title>
<style>
  :root { --bg: #ffb703; --ink: #3d2a00; --back: cubic-bezier(.175,.885,.32,1.275); --out: cubic-bezier(.2,0,0,1); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--ink); font-family: ui-rounded, "SF Pro Rounded", -apple-system, "PingFang TC", sans-serif; }
  /* 換階段：新顏色從畫面中心圓形擴散出來 */
  #wipe { position: fixed; inset: 0; clip-path: circle(0% at 50% 50%); }
  #wipe.go { transition: clip-path .55s var(--out); clip-path: circle(75% at 50% 50%); }
  #ui { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); text-align: center; transition: color .3s; }
  #meta { font-size: 18px; font-weight: 700; display: flex; justify-content: space-between; }
  #center { display: grid; place-content: center; }
  #label { justify-self: center; font-size: clamp(26px, 8vw, 40px); font-weight: 800; padding: 6px 22px; border-radius: 99px; background: var(--ink); color: var(--bg); }
  #num { font-size: min(58vw, 42vh); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  #next { font-size: 18px; font-weight: 700; }
  .enter #label { animation: drop .45s var(--back) both; }
  @keyframes drop { from { transform: translateY(-50px) scale(.6); opacity: 0; } }
  .pop #num { animation: pop .3s var(--back); }
  @keyframes pop { 0% { transform: scale(.85); } }
  .final #num { animation: big .5s var(--back); transform: scale(1.3); transform-origin: 50% 0; }
  @keyframes big { 0% { transform: scale(.7); } }
  /* 最後三秒：每秒從數字往外擴散一圈 */
  #burst { position: fixed; left: 50%; top: 50%; width: 60vw; height: 60vw; margin: -30vw; border-radius: 50%; border: 6px solid var(--ink); opacity: 0; pointer-events: none; }
  .final #burst { animation: burst .7s var(--out); }
  @keyframes burst { from { opacity: .5; transform: scale(.6); } to { opacity: 0; transform: scale(1.6); } }
  #pause, #start, #done { position: fixed; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center; font-size: 30px; font-weight: 800; }
  #pause { background: rgba(255,255,255,.6); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .paused #pause { opacity: 1; }
  #start { border: 0; background: #ffb703; color: #3d2a00; font: inherit; font-size: 30px; font-weight: 800; }
  #done { display: none; background: #8ac926; color: #1f3300; overflow: hidden; }
  .finished #done { display: grid; }
  .finished #done > div:first-child { animation: drop .6s var(--back) both; }
  #done button { font: inherit; font-size: 20px; padding: 14px 30px; border-radius: 99px; border: 0; background: #1f3300; color: #8ac926; }
  .bit { position: absolute; top: 50%; left: 50%; width: 14px; height: 14px; border-radius: 4px; animation: fly 1.1s var(--out) forwards; }
  @keyframes fly { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
  a.back { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); color: inherit; opacity: .5; font-size: 13px; text-decoration: none; z-index: 5; }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<div id="wipe"></div>
<div id="burst"></div>
<div id="ui" aria-live="polite">
  <div id="meta"><span id="m1"></span><span>C 彈跳</span></div>
  <div id="center"><div id="label"></div><div id="num"></div></div>
  <div id="next"></div>
</div>
<div id="pause">已暫停<div style="font-size:18px">點一下繼續</div></div>
<div id="done"><div style="font-size:48px">訓練完成！</div><div style="font-size:18px">2 組 × 2 回</div><button id="again">再看一次</button></div>
<button id="start">點一下開始預覽</button>
<a class="back" href="./">‹ 回樣品列表</a>
<script src="engine.js"></script>
<script>
const COLORS = { prep: ['#ffb703', '#3d2a00'], work: ['#ff595e', '#3b0003'], rest: ['#8ecae6', '#022b3a'], setRest: ['#c77dff', '#2a0845'] };
const $ = id => document.getElementById(id), root = document.documentElement, b = document.body;
const kick = cls => { b.classList.remove(cls); void b.offsetWidth; b.classList.add(cls); };
const begin = runDemo({
  onPhase(p) {
    const [bg, ink] = COLORS[p.type], w = $('wipe');
    w.className = ''; w.style.background = bg; void w.offsetWidth; w.className = 'go';
    setTimeout(() => { root.style.setProperty('--bg', bg); w.className = ''; }, 560);
    root.style.setProperty('--ink', ink);
    $('label').textContent = p.label; $('m1').textContent = p.meta; $('next').textContent = p.next;
    b.classList.remove('final'); kick('enter');
  },
  onSecond(sec) {
    $('num').textContent = sec;
    if (sec <= 3) { b.classList.remove('pop'); kick('final'); } else { b.classList.remove('final'); kick('pop'); }
  },
  onPause(on) { b.classList.toggle('paused', on); },
  onDone() {
    b.classList.add('finished');
    const box = $('done'), cs = ['#ff595e', '#ffca3a', '#1982c4', '#6a4c93', '#fff'];
    for (let k = 0; k < 18; k++) {
      const s = document.createElement('i'), a = k / 18 * Math.PI * 2, d = 120 + Math.random() * 120;
      s.className = 'bit'; s.style.background = cs[k % cs.length];
      s.style.setProperty('--x', Math.cos(a) * d + 'px'); s.style.setProperty('--y', Math.sin(a) * d + 'px');
      s.style.setProperty('--r', (Math.random() * 540 | 0) + 'deg');
      box.append(s);
    }
  },
});
wireStart(begin);
</script>
</body>
</html>
